{% extends 'base.html' %}{% block title %}Edit crop{% endblock %}{% block crumb %}Edit crop{% endblock %}{% block content %}
<div class="page-heading"><div><span class="eyebrow green">FARM INVENTORY</span><h1>Edit crop record</h1><p>Update the details for {{ crop.crop_name }}.</p></div><a class="btn secondary" href="{{ url_for('crops_page') }}">← Back to crops</a></div>
<section class="panel form-panel"><form method="post" class="form-grid"><label>Farm<select name="farm_id" required>{% for f in farms %}<option value="{{ f.id }}" {% if f.id==crop.farm_id %}selected{% endif %}>{{ f.name }}</option>{% endfor %}</select></label><label>Crop name<input name="crop_name" value="{{ crop.crop_name }}" required></label><label>Category<select name="crop_type">{% for x in ['Grain','Fruit','Vegetable','Other'] %}<option {% if x==crop.crop_type %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></label><label>Section / plot<input name="section" value="{{ crop.section or '' }}"></label><label>Area (acres)<input type="number" name="area_acres" min="0" step="0.1" value="{{ crop.area_acres or 0 }}"></label><label>Planting date<input type="date" name="planting_date" value="{{ crop.planting_date or '' }}"></label><label>Growth stage<select name="growth_stage">{% for x in ['Seedling','Vegetative','Flowering','Fruiting','Maturing','Harvest-ready'] %}<option {% if x==crop.growth_stage %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></label><div class="form-actions"><button class="btn primary">Save changes</button></div></form></section>{% endblock %}
