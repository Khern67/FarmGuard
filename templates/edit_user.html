{% extends 'base.html' %}{% block title %}Edit user{% endblock %}{% block crumb %}Edit user{% endblock %}{% block content %}
<div class="page-heading"><div><span class="eyebrow green">ACCESS CONTROL</span><h1>Edit user account</h1><p>Update the profile, role, or password for {{ user.username }}.</p></div><a class="btn secondary" href="{{ url_for('users_page') }}">← Back to users</a></div>
<section class="panel form-panel"><form method="post" class="form-grid"><label>Full name<input name="full_name" value="{{ user.full_name }}" required></label><label>Username<input value="{{ user.username }}" disabled></label><label>Role<select name="role"><option value="Worker" {% if user.role=='Worker' %}selected{% endif %}>Worker</option><option value="Owner" {% if user.role=='Owner' %}selected{% endif %}>Owner</option></select></label><label>New password <span class="muted">Leave blank to keep current password</span><input type="password" name="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters"></label><div class="form-actions"><button class="btn primary">Save user changes</button></div></form></section>{% endblock %}
